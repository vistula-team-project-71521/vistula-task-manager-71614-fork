
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 { text-align: center; }

        form, .task-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .task-item {
            border: 1px solid #ddd;
        }

        .task-title { font-weight: bold; }
        .task-status { color: gray; }
        #status-message { margin: 15px 0; }
    </style>

    <script src="app.js" defer></script>
</head>
<body>

    <h1>Task Manager</h1>
    <p>Student ID: <span id="student-id">71614</span></p>

    <form id="task-form">
        <input
            type="text"
            id="task-title"
            placeholder="Task title"
            required
        >

        <textarea
            id="task-description"
            placeholder="Task description"
        ></textarea>

        <button type="submit" id="task-submit">
            Save Task
        </button>
    </form>

    <p id="status-message" role="status"></p>

    <h2>My Tasks</h2>
    <div id="task-list"></div>

    <a href="contribution.html" id="contribution-link">
        Team Contribution
    </a>

</body>
</html>
